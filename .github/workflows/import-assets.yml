name: Import brand assets

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/import_assets.py"
      - ".github/workflows/import-assets.yml"

permissions:
  contents: write

concurrency:
  group: import-assets
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests pillow pymupdf

      - name: Download and process brand assets
        run: python scripts/import_assets.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand-assets
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "Import FOUR brand assets from Drive (resized/rendered for web)"
            git push
          fi
