name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: four_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      # must precede setup-node: its `cache: pnpm` needs pnpm on PATH.
      # Version comes from package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Neither task needs a database: `prisma generate` reads the schema
      # only, and the storefront falls back to a default API URL.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Called directly rather than through the root `test` script, which
      # wraps turbo in `dotenv -e .env` for local use; CI has no .env and
      # points the suite at the service container instead.
      - name: Test
        run: pnpm --filter @four/api test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/four_test
